name: Heresy Score CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: heresy-score-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks (browser scripts, data and service worker)
        run: |
          set -euo pipefail
          find scripts data tests -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check sw.js
          python3 -m py_compile tools/audio-qa/analyze_audio.py tools/audio-qa/analyze_library.py tests/test_full_audio_qa.py
      - name: Book safety and narrative score tests
        run: |
          set -euo pipefail
          node tests/app-integration.js
          node tests/archive-search-v2.js
          node tests/book-state-v4.js
          node tests/backup-restore-v2.js
          node tests/editorial-score-engine.js
          node tests/music-quality-gate.js
      - name: Spotify fitting and UI regression tests
        run: |
          set -euo pipefail
          node tests/bookvi-prelude-spotify.js
          node tests/spotify-folder-guide.js
          node tests/spotify-bidirectional-fit.js
          node tests/spotify-runtime-reconciliation.js
          node tests/spotify-audit-ui-consistency.js
      - name: Prevent publishing private reading source
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.mobi' -o -name '*.epub' -o -name '*private_extracted*' \) | grep .; then
            echo 'Private book source must never be committed.'
            exit 1
          fi
