name: Build app icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/ui/symbols/aquila.png'
      - 'scripts/build_app_icons.py'
      - '.github/workflows/build-app-icons.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build_app_icons.py
      - name: Commit generated icons
        run: |
          if git diff --quiet -- assets/ui/icons; then
            echo "Icons already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/icons
          git commit -m "chore: rebuild app icon assets"
          git push
