<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Caliban — arquivo visual de reconstruções</title>
<desc>Quatro ilustrações originais e não canônicas: dois jovens cavaleiros, as florestas de Caliban e uma fortaleza da Ordem.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#42514a"/><stop offset=".53" stop-color="#1b2926"/><stop offset="1" stop-color="#0b1517"/></linearGradient>
 <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#82938a" stop-opacity=".63"/><stop offset="1" stop-color="#192a27" stop-opacity=".02"/></linearGradient>
 <linearGradient id="iron" x2=".2" y2="1"><stop stop-color="#72857c"/><stop offset=".5" stop-color="#283735"/><stop offset="1" stop-color="#111e20"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#9a9e88"/><stop offset=".45" stop-color="#606c64"/><stop offset="1" stop-color="#24332f"/></linearGradient>
 <radialGradient id="pale"><stop stop-color="#c8c7ae" stop-opacity=".6"/><stop offset="1" stop-color="#afc8aa" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="17" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="7" r=".7" fill="#d7d2ae" opacity=".1"/><circle cx="13" cy="15" r=".8" fill="#000" opacity=".19"/></pattern>
 <clipPath id="a"><rect x="0" y="0" width="400" height="400"/></clipPath>
 <clipPath id="b"><rect x="400" y="0" width="400" height="400"/></clipPath>
 <clipPath id="c"><rect x="0" y="400" width="400" height="400"/></clipPath>
 <clipPath id="d"><rect x="400" y="400" width="400" height="400"/></clipPath>
</defs>
<!-- Zahariel: youthful human aspirant, not a Space Marine -->
